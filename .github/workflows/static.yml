# Pages-Quelle steht auf "GitHub Actions". Der Legacy-Workflow
# (dynamic/pages/pages-build-deployment) wird dann nicht mehr disponiert,
# deshalb dieser hier: statische Dateien unveraendert hochladen, kein Build.
name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Laufende Deployments nicht abbrechen, nachfolgende Pushes aber zusammenfassen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
